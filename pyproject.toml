[project]
name = "hermes-brain"
version = "0.1.0"
description = "Global memory & continual learning for Hermes Agent"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
# The floor tier is stdlib-only by design. Heavy tiers are extras,
# lazy-installed by `hermes brain doctor --fix` / setup (P2+).
dependencies = []

[project.optional-dependencies]
full = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]
# Late-interaction ColBERT rerank stage (memory-engine.md §3.4). Shares onnx +
# tokenizers with the `full` tier; broken out so a floor/lite install can add
# reranking without the vector stack, and vice versa.
rerank = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
# Multi-device encrypted delta sync (Phase G). Client-side crypto only; the
# relay stores opaque ciphertext. Never required at floor tier — lazy-imported
# inside the sync/ subpackage so a no-sync install never needs cryptography.
sync = [
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.setuptools]
# The repo root IS the Hermes plugin directory: the host loads it BY PATH
# (spec_from_file_location, registered under a synthetic package name), never
# through `import hermes_brain`. There are no console scripts and no entry
# points, so there is deliberately NOTHING to install into site-packages —
# this project's pip install exists only to resolve the optional-dependency
# extras ([dev], [full], [rerank], [sync]).
#
# These empty lists are load-bearing, not decoration. Without them setuptools
# runs flat-layout auto-discovery, finds a dozen top-level packages
# (bootstrap, capture, dream, memfs, recall, skillforge, store, sync, replay,
# observer, tests) plus nine root modules, cannot choose, and aborts — BEFORE
# it ever reads [project.optional-dependencies]. That is why the documented
# `pip install -e .[dev]` and `.[full]` both failed with a package-discovery
# error. Declaring "install nothing" is the honest fix; inventing a package
# name here would put a second, importable copy of the plugin on sys.path and
# invite exactly the dual-identity bugs _compat.py exists to avoid.
packages = []
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# E402: root-level modules (cli.py, tools.py, __init__.py) MUST stay
#       import-light — the Hermes loader eagerly imports them on every CLI
#       invocation — so heavy sibling imports are deliberately deferred into
#       function bodies.
# B904: several `raise LLMUnavailable`/`_ToolError` sites intentionally drop
#       the provider's original traceback from user-facing tool/LLM errors.
ignore = [
    "E501", "E402", "B904",
    # SIM105: the `try/except sqlite3.Error: pass` rollback idiom is used
    # deliberately and consistently; contextlib.suppress reads no clearer.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905"]  # zip(...) in tests doesn't need strict=

[tool.pytest.ini_options]
testpaths = ["tests"]
